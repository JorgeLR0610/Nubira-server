name: API checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          # Quita la autenticación solo en este servicio temporal, ligado a loopback.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TZ: UTC
      OMP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python fetch_artifacts.py --check
      - name: API con SQLite y proveedores simulados
        run: python -m pytest
      - name: API con PostgreSQL local y proveedores simulados
        env:
          NUBIRA_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: python -m pytest
